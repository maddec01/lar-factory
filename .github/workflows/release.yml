name: Release

on:
  # A Nightly for each CI run on main; release-plan.cjs publishes only green pushes.
  # Only main's runs start it, so a pull request's CI run never joins the release
  # group below and replaces a waiting run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A Stable Release, rebuilt from the latest Nightly's commit.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except publishing"
        required: false
        default: false
        type: boolean

# One release job at a time, so two runs never publish out of order or tag the
# same commit twice. A running publisher is never canceled, but GitHub keeps only
# the newest waiting run: a Nightly started while another run waits replaces it.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  APP_PACKAGE_JSON: app/package.json

jobs:
  # Runs main's copy of the planning script, never code from the CI run's head,
  # and holds no secrets. It reads the Release commit's version with git show and
  # fails unless main contains that commit.
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      feed: ${{ steps.plan.outputs.feed }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history, to check the Release commit is on main.
          fetch-depth: 0
          # git ls-remote reads this public repo's tags without the token.
          persist-credentials: false

      - id: plan
        name: Plan the Release
        run: git ls-remote --tags origin | node .github/scripts/release-plan.cjs "$APP_PACKAGE_JSON"

  release:
    name: Publish GitHub Release
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      # No unsigned Release is ever published: without every signing secret the
      # job stops here.
      - name: Check the signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the release environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Run bash scripts/release-secrets.sh to set them."
            exit 1
          fi

      - name: Check out the Release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The build runs the commit's scripts; keep the write token out of .git/config.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: board/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: board/package.json

      - name: Install dependencies
        run: |
          pnpm --dir board install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile

      # Builds, signs and notarizes the Apple Silicon dmg and zip as the planned
      # version, with their blockmaps and the planned feed, into release-assets/.
      # app/scripts/build-desktop-artifact.ts fails without every signing variable
      # or when electron-builder writes no feed.
      - name: Build, sign and notarize the board app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          # @electron/notarize reads the API key from a file.
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"

          pnpm --dir app run build --build-version "$VERSION" --output-dir "$GITHUB_WORKSPACE/release-assets"

      - name: Delete the App Store Connect key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Write checksums
        working-directory: release-assets
        run: |
          shasum -a 256 -- *.dmg *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/${{ needs.plan.outputs.feed }}
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
