name: Release

on:
  # A Nightly for each CI run on main; release-plan.cjs publishes only green pushes.
  # Only main's runs start it, so a pull request's CI run never joins the release
  # group below and replaces a waiting run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A Stable Release, rebuilt from the latest Nightly's commit.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except publishing"
        required: false
        default: false
        type: boolean

# One release job at a time, so two runs never publish out of order or tag the
# same commit twice. A running publisher is never canceled, but GitHub keeps only
# the newest waiting run: a Nightly started while another run waits replaces it.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  APP_PACKAGE_JSON: app/package.json

jobs:
  # Runs main's copy of the planning script, never code from the CI run's head,
  # and holds no secrets. It reads the Release commit's version with git show and
  # fails unless main contains that commit.
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      feed: ${{ steps.plan.outputs.feed }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history, to check the Release commit is on main.
          fetch-depth: 0
          # git ls-remote reads this public repo's tags without the token.
          persist-credentials: false

      - id: plan
        name: Plan the Release
        run: git ls-remote --tags origin | node .github/scripts/release-plan.cjs "$APP_PACKAGE_JSON"

  release:
    name: Publish GitHub Release
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      # No unsigned Release is ever published: without every signing secret the
      # job stops here.
      - name: Check the signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the release environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Run bash scripts/release-secrets.sh to set them."
            exit 1
          fi

      - name: Check out the Release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # BUILD STEP (#211): build, sign and notarize the Apple Silicon dmg and zip
      # as the planned version, writing them with their blockmaps and the planned
      # feed file into release-assets/.
      # Until then this step fails, so nothing is published without them.
      - name: Build the board app
        run: |
          echo "::error::The build step is not written yet (maddec01/mux-factory#211)."
          exit 1

      - name: Write checksums
        working-directory: release-assets
        run: |
          shasum -a 256 -- *.dmg *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/${{ needs.plan.outputs.feed }}
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
