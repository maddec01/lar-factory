# Packages the board app with electron-builder, as T3 Code's
# scripts/build-desktop-artifact.ts does (createBuildConfig). `pnpm run build`
# passes the platform and architecture: Mac, arm64, unsigned. Another platform
# adds its section below and its own flags.
#
# app.asar holds the main process and preload; vp pack bundled their dependencies.
# The board server runs as source with Electron's Node, which can't strip types
# inside an asar, so its files go to Resources/ as plain files. Packaged,
# Electron's app path is Resources/app.asar, and src/backend/BoardServer.ts
# finds board/ and config.json beside it.

appId: com.maddec01.mux-factory.board
productName: Mux Factory
electronLanguages: [en-US]
# No native modules to rebuild for Electron.
npmRebuild: false
# A missing publish makes electron-builder infer a GitHub feed from GH_TOKEN.
publish: null

directories:
  output: release

files:
  - package.json
  - dist-electron/**/*
  - "!**/*.map"
  # Goes to Resources/bundle below: Electron's fs can't copy a folder out of an asar.
  - "!dist-electron/bundle/**/*"
  # Bundled into dist-electron/main.cjs already.
  - "!node_modules/**/*"

extraResources:
  - from: ../board/src
    to: board/src
    # The page's sources: board/dist holds their build.
    filter: ["**/*", "!**/*.tsx", "!app/**", "!styles.css"]
  - from: ../board/dist
    to: board/dist
  # Its "type": "module" makes Node load board/src as ES modules.
  - from: ../board/package.json
    to: board/package.json
  - from: dist-electron/bundle
    to: bundle
  - from: ../config.json
    to: config.json
  # T3 Code's MIT licence: the main process, preload and scripts copy its code.
  - from: LICENSE
    to: LICENSE.t3code.txt

mac:
  target: dir
  category: public.app-category.developer-tools
  # Unsigned: skip looking for a signing identity in the keychain.
  identity: null
