# Branch protection requires the `Tests` job, and before a Nightly the board app's
# Release workflow looks up this workflow's runs, so keep both names as they are.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A PR's newer run cancels its older one. Each push to main gets its own group,
# so every commit on main keeps a finished run and a later push never cancels an
# earlier one.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    # The tests call /bin/zsh, launchctl and plutil.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # No step pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Shared tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/shared
        run: pnpm test

      - name: Shared typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/shared
        run: pnpm run typecheck

      - name: Server tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/server
        run: pnpm test

      - name: Server typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/server
        run: pnpm run typecheck

      - name: Web tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm test

      - name: Web typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm run typecheck

      - name: Desktop tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/desktop
        run: pnpm test

      - name: Desktop typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/desktop
        run: pnpm run typecheck

      - name: Worktree setup tests
        if: ${{ !cancelled() }}
        run: bash scripts/setup-worktree.test.sh

      - name: mux-work slice tests
        if: ${{ !cancelled() }}
        run: bash skills/mux-work/scripts/slice.test.sh

      - name: mux-work status tests
        if: ${{ !cancelled() }}
        run: bash skills/mux-work/scripts/status.test.sh

      - name: skill-sync preview tests
        if: ${{ !cancelled() }}
        run: bash skills/skill-sync/scripts/preview-copy.test.sh

      - name: Release plan tests
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/release-plan.test.cjs

      - name: Release secrets wizard tests
        if: ${{ !cancelled() }}
        run: bash scripts/release-secrets.test.sh
