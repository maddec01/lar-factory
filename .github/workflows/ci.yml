# Before a Nightly the board app's Release workflow looks up this workflow's runs
# by file name and reads the run's conclusion, so keep the file and workflow names.
# The jobs run in parallel, each with one workspace install; the `Tests` job at the end,
# the required check, fails when any other job failed or was cancelled.
name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

# A PR's newer run cancels its older one. Each push to main gets its own group,
# so every commit on main keeps a finished run and a later push never cancels an
# earlier one.
concurrency:
    group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
    cancel-in-progress: true

jobs:
    checks:
        name: Typecheck, knip and lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  # No step pushes; keep the token out of .git/config.
                  persist-credentials: false

            - name: Set up workspace
              id: install
              uses: ./.github/actions/setup-workspace

            # The root project, then every package's own tsconfig.
            - name: Typecheck
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm run typecheck

            - name: Knip
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm run knip

            # Formatting, lint and type checks, with @lar-works/config's rules (the root vite.config.ts).
            - name: Format and lint
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm run check

    server:
        name: Server tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Set git's default branch
              run: git config --global init.defaultBranch main

            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            # Assembles the skills and builds apps/web, which the tests serve, then runs them.
            - name: Tests
              working-directory: apps/server
              run: pnpm test

    unit:
        name: Web, packages and script tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # The script tests need bash, git, jq and Node. The shared scripts run lar-work,
        # which needs the workspace installed.
        steps:
            - name: Set git's default branch
              run: git config --global init.defaultBranch main

            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up workspace
              id: install
              uses: ./.github/actions/setup-workspace

            - name: Web tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              working-directory: apps/web
              run: pnpm test

            - name: Shared tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              working-directory: packages/shared
              run: pnpm test

            - name: Work-records tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              working-directory: packages/work-records
              run: pnpm test

            - name: Shared slice tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bash skills/shared/scripts/slice.test.sh

            - name: Shared slice worktree removal tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bash skills/shared/scripts/remove-slice-worktree.test.sh

            - name: Shared status tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bash skills/shared/scripts/status.test.sh

            - name: Shared repo config tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bash skills/shared/scripts/repo-config.test.sh

            - name: skill-sync tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: for test in .agents/skills/skill-sync/scripts/*.test.sh; do bash "$test" || exit 1; done

            - name: Release plan tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: node --test --test-reporter=spec .github/scripts/release-plan.test.cjs

            - name: Release secrets wizard tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bash scripts/release-secrets.test.sh

    macos:
        name: macOS tests
        # The desktop tests need macOS, and the worktree setup test reads file times
        # with BSD `stat -f`, which GNU stat runs without error and without output.
        runs-on: macos-latest
        timeout-minutes: 15
        steps:
            - name: Set git's default branch
              run: git config --global init.defaultBranch main

            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up workspace
              id: install
              uses: ./.github/actions/setup-workspace

            - name: Desktop tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              working-directory: apps/desktop
              run: pnpm test

            - name: Worktree setup tests
              if: ${{ !cancelled() }}
              run: bash scripts/setup-worktree.test.sh

    tests:
        name: Tests
        needs: [checks, server, unit, macos]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check every job passed
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"' <<<"$NEEDS")
                  [[ -z $failed ]] && exit 0
                  while read -r job result; do
                    echo "::error::$job $result"
                  done <<<"$failed"
                  exit 1
